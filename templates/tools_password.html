{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto">
  <div class="mb-6">
    <a href="{{ url_for('tools.tools_page') }}" class="text-sm text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1 mb-4">
      <i class="fas fa-arrow-left"></i> Back to Tools
    </a>
    <h2 class="text-3xl font-bold text-gray-800 dark:text-white flex items-center gap-3">
      <i class="fas fa-key text-rose-600"></i> Password Generator
    </h2>
    <p class="text-gray-500 dark:text-gray-400 mt-2">Create strong, secure passwords with full control over character types.</p>
  </div>

  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Password Length: <span id="length-display" class="text-indigo-600">16</span></label>
          <input type="range" id="pwd-length" min="4" max="128" value="16" class="w-full">
        </div>
        <div class="space-y-3 mb-4">
          <label class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" id="use-upper" checked class="w-5 h-5 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
            <span class="text-gray-700 dark:text-gray-300">Uppercase (A-Z)</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" id="use-lower" checked class="w-5 h-5 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
            <span class="text-gray-700 dark:text-gray-300">Lowercase (a-z)</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" id="use-digits" checked class="w-5 h-5 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
            <span class="text-gray-700 dark:text-gray-300">Digits (0-9)</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" id="use-symbols" class="w-5 h-5 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
            <span class="text-gray-700 dark:text-gray-300">Symbols (!@#$%...)</span>
          </label>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Exclude characters</label>
          <input type="text" id="exclude-chars" placeholder="e.g. O0Il1" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-rose-500 outline-none">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Number of passwords: <span id="count-display">1</span></label>
          <input type="range" id="pwd-count" min="1" max="20" value="1" class="w-full">
        </div>
        <button id="generate-btn" class="w-full bg-rose-600 hover:bg-rose-700 text-white px-6 py-3 rounded-xl shadow transition font-medium">
          <i class="fas fa-key mr-2"></i> Generate Passwords
        </button>
      </div>
      <div>
        <div id="spinner" class="hidden text-center py-8"><i class="fas fa-spinner fa-spin text-4xl text-rose-600"></i></div>
        <div id="result" class="hidden space-y-3"></div>
        <div id="empty-state" class="text-center text-gray-400 dark:text-gray-500 py-8">
          <i class="fas fa-key text-6xl mb-3 opacity-30"></i>
          <p>Configure options and generate</p>
        </div>
        <div id="error-msg" class="hidden mt-4 p-3 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-xl text-red-700 dark:text-red-400 text-sm"></div>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('pwd-length').addEventListener('input', function() {
    document.getElementById('length-display').textContent = this.value;
  });
  document.getElementById('pwd-count').addEventListener('input', function() {
    document.getElementById('count-display').textContent = this.value;
  });

  document.getElementById('generate-btn').addEventListener('click', async () => {
    document.getElementById('spinner').classList.remove('hidden');
    document.getElementById('result').classList.add('hidden');
    document.getElementById('empty-state').classList.add('hidden');
    document.getElementById('error-msg').classList.add('hidden');

    try {
      const resp = await fetch('{{ url_for("tools.password_generator") }}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          length: parseInt(document.getElementById('pwd-length').value),
          use_upper: document.getElementById('use-upper').checked,
          use_lower: document.getElementById('use-lower').checked,
          use_digits: document.getElementById('use-digits').checked,
          use_symbols: document.getElementById('use-symbols').checked,
          exclude: document.getElementById('exclude-chars').value,
          count: parseInt(document.getElementById('pwd-count').value)
        })
      });
      const data = await resp.json();
      document.getElementById('spinner').classList.add('hidden');
      if (data.success) {
        const container = document.getElementById('result');
        container.innerHTML = '';
        container.classList.remove('hidden');
        data.passwords.forEach((pwd, i) => {
          const div = document.createElement('div');
          div.className = 'flex items-center gap-2 p-3 bg-gray-50 dark:bg-gray-700/50 rounded-xl border border-gray-200 dark:border-gray-600';
          div.innerHTML = `
            <span class="text-xs text-gray-400 w-6">${i+1}.</span>
            <code class="flex-1 font-mono text-sm text-gray-800 dark:text-gray-200 select-all">${pwd}</code>
            <button onclick="copyPassword(this)" class="text-indigo-600 hover:text-indigo-800 dark:text-indigo-400 text-sm p-1" title="Copy">
              <i class="fas fa-copy"></i>
            </button>
          `;
          container.appendChild(div);
        });
      } else {
        showPwdError(data.error || 'Generation failed');
      }
    } catch (err) {
      document.getElementById('spinner').classList.add('hidden');
      showPwdError('Network error: ' + err.message);
    }
  });

  function copyPassword(btn) {
    const code = btn.closest('div').querySelector('code');
    if (!code) return;
    navigator.clipboard.writeText(code.textContent).then(() => {
      const icon = btn.querySelector('i');
      icon.className = 'fas fa-check text-green-500';
      setTimeout(() => { icon.className = 'fas fa-copy'; }, 1500);
    });
  }

  function showPwdError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.classList.remove('hidden');
  }
</script>
{% endblock %}
