{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto text-center py-24">
  <h1 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 mb-6">
    Ahmed BOURAMDANE
  </h1>
  <p class="text-xl text-gray-500 mb-10">Your smart personal organiser – notes, tasks, calendar & AI chat.</p>
  {% if not current_user.is_authenticated %}
  <div class="flex justify-center gap-4">
    <a href="{{ url_for('auth.register') }}" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl font-semibold shadow-lg transition">
      <i class="fas fa-rocket mr-2"></i> Get Started
    </a>
    <a href="{{ url_for('auth.login') }}" class="border-2 border-indigo-600 text-indigo-600 hover:bg-indigo-50 px-8 py-3 rounded-xl font-semibold shadow-lg transition">
      <i class="fas fa-sign-in-alt mr-2"></i> Login
    </a>
  </div>
  {% else %}
  <a href="{{ url_for('dashboard.dashboard') }}" class="bg-indigo-600 hover:bg-indigo-700 text-white px-10 py-4 rounded-xl font-semibold shadow-lg transition inline-block">
    <i class="fas fa-arrow-right mr-2"></i> Go to Dashboard
  </a>
  {% endif %}
</div>
{% endblock %}
