{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-8 mt-12">
  <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">
    <i class="fas fa-user-plus text-indigo-600 mr-2"></i> Create Account
  </h2>
  <form method="POST">
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
      <input type="text" name="username" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
    </div>
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="email" name="email" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
    </div>
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <input type="password" name="password" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
    </div>
    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
      <input type="password" name="confirm_password" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
    </div>
    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-md transition">
      <i class="fas fa-check mr-2"></i> Register
    </button>
  </form>
  <div class="mt-6">
    <div class="relative">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-gray-300"></div>
      </div>
      <div class="relative flex justify-center text-sm">
        <span class="px-2 bg-white text-gray-500">Or</span>
      </div>
    </div>
    <div class="mt-6">
      <a href="{{ url_for('auth.login_google') }}" class="w-full flex items-center justify-center gap-2 bg-white border border-gray-300 px-4 py-3 rounded-xl text-gray-700 hover:bg-gray-50 transition shadow-sm font-medium">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" class="w-5 h-5">
        Sign up with Google
      </a>
      <p class="text-[10px] text-gray-400 mt-2 text-center">
        Getting redirect error? Ensure Google Cloud Console Redirect URI is set to:<br>
        <code class="bg-gray-100 px-1 py-0.5 rounded">{{ url_for('auth.authorized_google', _external=True) }}</code>
      </p>
    </div>
  </div>
  <p class="mt-6 text-center text-gray-500">
    Already have an account? <a href="{{ url_for('auth.login') }}" class="text-indigo-600 font-medium hover:underline">Login</a>
  </p>
</div>
{% endblock %}
