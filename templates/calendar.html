{% extends "base.html" %}
{% block content %}
<h2 class="text-3xl font-bold text-gray-800 mb-6">My Calendar</h2>
<div id="calendar" class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100"></div>

<!-- Custom Event Modal -->
<div id="event-modal-backdrop" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center backdrop-blur-sm transition-opacity opacity-0">
  <div id="event-modal" class="bg-white dark:bg-gray-800 rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden transform scale-95 transition-all duration-300">
    <!-- Header -->
    <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-800/50">
      <h3 id="event-modal-title" class="text-xl font-bold text-gray-800 dark:text-white">New Event</h3>
      <button type="button" id="close-event-modal" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition focus:outline-none">
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>
    <!-- Body -->
    <div class="p-6 overflow-y-auto max-h-[70vh] space-y-4">
      <form id="event-form">
        <input type="hidden" id="event-id">
        <div>
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Title</label>
          <input type="text" id="event-title" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Event title">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Description</label>
          <textarea id="event-desc" rows="3" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Details..."></textarea>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Location</label>
          <input type="text" id="event-location" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Location">
        </div>
        
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Start</label>
            <input type="datetime-local" id="event-start" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">End</label>
            <input type="datetime-local" id="event-end" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>
        
        <div class="flex items-center gap-2 mt-2">
          <input type="checkbox" id="event-allDay" class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
          <label class="text-sm font-medium text-gray-700 dark:text-gray-300">All day event</label>
        </div>
        
        <div class="grid grid-cols-2 gap-4">
          <div>
             <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Color</label>
             <input type="color" id="event-color" class="w-full h-10 rounded-xl cursor-pointer border-none p-0 bg-transparent">
          </div>
          <div>
             <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Repeat</label>
             <select id="event-repeat" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none">
               <option value="none">No repeat</option>
               <option value="daily">Daily</option>
               <option value="weekly">Weekly</option>
               <option value="monthly">Monthly</option>
             </select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Reminder (mins before)</label>
          <input type="number" id="event-reminder" value="30" min="0" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <!-- Attachments & Camera -->
        <div class="mt-4 border-t border-gray-200 dark:border-gray-700 pt-4">
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Attachments</label>
          <div class="flex gap-2">
            <!-- File Upload -->
            <label class="cursor-pointer bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-300 px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2">
              <i class="fas fa-image"></i> Browse
              <input type="file" id="event-files" multiple accept="image/*" class="hidden">
            </label>
            <!-- Camera Capture -->
            <label class="cursor-pointer bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-900/30 dark:hover:bg-indigo-900/50 text-indigo-700 dark:text-indigo-400 px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2">
              <i class="fas fa-camera"></i> Take Photo
              <input type="file" id="event-camera" accept="image/*" capture="environment" class="hidden">
            </label>
          </div>
          <p class="text-xs text-gray-500 mt-2 hidden" id="selected-files-text"></p>
          <div id="existing-attachments" class="mt-3 space-y-2"></div>
        </div>
      </form>
    </div>
    <!-- Footer -->
    <div class="px-6 py-4 border-t border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 flex justify-end gap-3">
      <button type="button" id="cancel-event-btn" class="px-5 py-2 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 font-medium transition">Cancel</button>
      <button type="button" id="save-event-btn" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow font-medium transition">Save Event</button>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
{% endblock %}
