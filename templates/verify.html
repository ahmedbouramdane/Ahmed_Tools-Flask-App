{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-8 mt-12">
  <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">
    <i class="fas fa-envelope text-indigo-600 mr-2"></i> Verify Your Email
  </h2>
  <p class="text-gray-600 mb-6 text-center">
    A 6‑digit code was sent to <strong>{{ user.email }}</strong>.<br>
    <span class="text-sm">It expires in 10 minutes.</span>
  </p>
  <form method="POST">
    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-1">Verification Code</label>
      <input type="text" name="code" required pattern="[0-9]{6}" maxlength="6"
             class="w-full px-4 py-3 border border-gray-300 rounded-xl text-center text-2xl tracking-wide focus:ring-2 focus:ring-indigo-500 outline-none"
             placeholder="000000">
    </div>
    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-md transition">
      <i class="fas fa-check mr-2"></i> Verify Account
    </button>
  </form>
  <p class="mt-4 text-center text-gray-500 text-sm">
    Didn't receive the code? <a href="{{ url_for('auth.register') }}" class="text-indigo-600 hover:underline">Register again</a>.
  </p>
</div>
{% endblock %}
