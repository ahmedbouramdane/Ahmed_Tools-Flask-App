{% extends "base.html" %}
{% block title %}Tools - Ahmed-Stack{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto">
  <div class="mb-4 sm:mb-6">
    <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 dark:text-white flex items-center gap-2 sm:gap-3">
      <i class="fas fa-toolbox text-indigo-600"></i> Tools
    </h2>
    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Utility tools for everyday tasks — no page reloads needed</p>
  </div>

  <!-- Category tabs -->
  <div class="flex gap-1.5 sm:gap-2 overflow-x-auto pb-2 scrollbar-none mb-4" id="category-tabs">
    <button class="cat-tab active px-3 sm:px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl bg-indigo-600 text-white whitespace-nowrap transition" data-cat="image"><i class="fas fa-image mr-1.5"></i> Image</button>
    <button class="cat-tab px-3 sm:px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 whitespace-nowrap transition" data-cat="pdf"><i class="fas fa-file-pdf mr-1.5"></i> PDF</button>
    <button class="cat-tab px-3 sm:px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 whitespace-nowrap transition" data-cat="security"><i class="fas fa-shield-halved mr-1.5"></i> Security</button>
    <button class="cat-tab px-3 sm:px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 whitespace-nowrap transition" data-cat="web"><i class="fas fa-globe mr-1.5"></i> Web Dev</button>
    <button class="cat-tab px-3 sm:px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 whitespace-nowrap transition" data-cat="text"><i class="fas fa-font mr-1.5"></i> Text</button>
    <button class="cat-tab px-3 sm:px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 whitespace-nowrap transition" data-cat="math"><i class="fas fa-calculator mr-1.5"></i> Math</button>
    <button class="cat-tab px-3 sm:px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 whitespace-nowrap transition" data-cat="ai"><i class="fas fa-robot mr-1.5"></i> AI</button>
    <button class="cat-tab px-3 sm:px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 whitespace-nowrap transition" data-cat="dev"><i class="fas fa-code mr-1.5"></i> Developer</button>
  </div>

  <!-- Tool grid / workspace -->
  <div id="tools-content" class="min-h-[400px]"></div>

<style>
@keyframes proc-bar-indeterminate {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(400%); }
}
.proc-bar {
  background: #6366f1;
  transition: width .4s cubic-bezier(.4,0,.2,1);
  position: relative;
  overflow: hidden;
}
.proc-bar::after {
  content: '';
  position: absolute;
  inset: 0;
  width: 50%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
  animation: proc-bar-indeterminate 1.2s ease-in-out infinite;
}
</style>
</div>

<script>
{% include "tools/_tool_defs.html" %}
{% include "tools/_state_and_grid.html" %}
{% include "tools/_helpers.html" %}
{% include "tools/_image_upload.html" %}
{% include "tools/_image_crop.html" %}
{% include "tools/_image_tools.html" %}
{% include "tools/_pdf_tools.html" %}
{% include "tools/_security_tools.html" %}
{% include "tools/_web_tools.html" %}
{% include "tools/_text_tools.html" %}
{% include "tools/_ai_tools.html" %}
{% include "tools/_dev_tools.html" %}
{% include "tools/_math_tools.html" %}
</script>
<script>if (!openToolFromUrl()) renderToolGrid();</script>
{% endblock %}
