// ═══════════════════════════════════════════════════════════════════════════
//  APP STATE
// ═══════════════════════════════════════════════════════════════════════════

var currentCat = 'image';
var currentTool = null;

// ═══════════════════════════════════════════════════════════════════════════
//  CATEGORY TABS
// ═══════════════════════════════════════════════════════════════════════════

document.getElementById('category-tabs').addEventListener('click', function(e) {
  var tab = e.target.closest('.cat-tab');
  if (!tab) return;
  currentCat = tab.dataset.cat;
  currentTool = null;
  this.querySelectorAll('.cat-tab').forEach(function(t) {
    t.classList.remove('active', 'bg-indigo-600', 'text-white');
    t.classList.add('bg-gray-100', 'dark:bg-gray-700', 'text-gray-600', 'dark:text-gray-300');
  });
  tab.classList.remove('bg-gray-100', 'dark:bg-gray-700', 'text-gray-600', 'dark:text-gray-300');
  tab.classList.add('bg-indigo-600', 'text-white');
  renderToolGrid();
});

// ═══════════════════════════════════════════════════════════════════════════
//  RENDER TOOL GRID
// ═══════════════════════════════════════════════════════════════════════════

function renderToolGrid() {
  var tools = TOOLS[currentCat] || [];
  var container = document.getElementById('tools-content');
  container.innerHTML = '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4">' +
    tools.map(function(t) {
      return '<div class="tool-card bg-white dark:bg-gray-800 rounded-xl sm:rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-4 sm:p-5 cursor-pointer hover:shadow-md hover:border-indigo-200 dark:hover:border-indigo-700 transition-all duration-200 flex flex-col" data-tool="' + t.id + '">' +
        '<div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-' + t.color + '-100 dark:bg-' + t.color + '-900/30 flex items-center justify-center mb-3"><i class="' + t.icon + ' text-xl sm:text-2xl text-' + t.color + '-600 dark:text-' + t.color + '-400"></i></div>' +
        '<h3 class="text-base sm:text-lg font-bold text-gray-800 dark:text-white mb-1">' + t.title + '</h3>' +
        '<p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 flex-1">' + t.desc + '</p>' +
      '</div>';
    }).join('') + '</div>';

  container.querySelectorAll('.tool-card').forEach(function(card) {
    card.addEventListener('click', function() {
      var id = this.dataset.tool;
      var tool = TOOLS[currentCat].find(function(t) { return t.id === id; });
      if (tool) openTool(tool);
    });
  });
}

// ═══════════════════════════════════════════════════════════════════════════
//  OPEN TOOL
// ═══════════════════════════════════════════════════════════════════════════

function openTool(tool) {
  currentTool = tool;
  var container = document.getElementById('tools-content');
  container.innerHTML = '<div class="mb-4 flex items-center gap-3">' +
    '<button onclick="renderToolGrid()" class="p-2 text-gray-500 hover:text-indigo-600 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition"><i class="fas fa-arrow-left"></i></button>' +
    '<div><h3 class="text-lg sm:text-xl font-bold text-gray-800 dark:text-white">' + tool.icon.replace('fa-', '<i class="fas fa-').replace('" title','"></i> ') + tool.title + '</h3>' +
    '<p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400">' + tool.desc + '</p></div></div><div id="tool-workspace" class="bg-white dark:bg-gray-800 rounded-xl sm:rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-4 sm:p-6"></div>';

  var fnName = 'tool_' + currentCat + '_' + tool.id.replace(/-/g, '_');
  if (typeof window[fnName] === 'function') {
    window[fnName]();
  } else {
    document.getElementById('tool-workspace').innerHTML = '<p class="text-gray-400 text-center py-8">Tool interface coming soon</p>';
  }
}

// ═══════════════════════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════════════════════

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function downloadData(filename, dataUrl) {
  var a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function showToast(msg, icon) {
  if (typeof Swal !== 'undefined') {
    Swal.fire({ toast:true, position:'top-end', icon:icon||'success', title:msg, showConfirmButton:false, timer:2000 });
  }
}

function copyResult(elId) {
  var el = document.getElementById(elId);
  if (!el) return;
  if (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') {
    el.select(); el.setSelectionRange(0, 99999);
  }
  navigator.clipboard.writeText(el.value || el.textContent);
  showToast('Copied!', 'success');
}

// ─── Dynamic CodeMirror loader ────────────────────────────────────────────

var _cmLoaded = false;
var _cmLoading = false;
var _cmQueue = [];

function loadCodeMirror(callback) {
  if (window.CodeMirror) { callback(); return; }
  _cmQueue.push(callback);
  if (_cmLoading) return;
  _cmLoading = true;
  var link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css';
  document.head.appendChild(link);
  var darkTheme = document.createElement('link');
  darkTheme.rel = 'stylesheet';
  darkTheme.href = 'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css';
  darkTheme.id = 'cm-dark-theme';
  document.head.appendChild(darkTheme);
  var s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js';
  s.onload = function() {
    _cmLoaded = true;
    _cmLoading = false;
    _cmQueue.forEach(function(fn) { fn(); });
    _cmQueue = [];
  };
  document.body.appendChild(s);
}

function loadCodeMirrorMode(mode, callback) {
  var modes = {
    sass: 'sass/sass.min.js',
    css: 'css/css.min.js',
    javascript: 'javascript/javascript.min.js',
    html: 'htmlmixed/htmlmixed.min.js',
    xml: 'xml/xml.min.js',
    coffeescript: 'coffeescript/coffeescript.min.js',
  };
  var suffix = modes[mode];
  if (!suffix || window['CodeMirror_' + mode]) { callback(); return; }
  var s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/' + suffix;
  s.onload = function() { window['CodeMirror_' + mode] = true; callback(); };
  document.body.appendChild(s);
}

function createCodeEditor(textareaId, mode) {
  var ta = document.getElementById(textareaId);
  if (!ta) return null;
  var editor = CodeMirror.fromTextArea(ta, {
    lineNumbers: true,
    matchBrackets: true,
    autoCloseBrackets: true,
    tabSize: 2,
    indentUnit: 2,
    indentWithTabs: false,
    theme: document.documentElement.classList.contains('dark') ? 'material-darker' : 'default',
    viewportMargin: Infinity,
    extraKeys: {
      'Ctrl-S': function(ed) { ed.execCommand('insertSoftTab'); }
    }
  });
  // Watch for theme changes
  var observer = new MutationObserver(function() {
    editor.setOption('theme', document.documentElement.classList.contains('dark') ? 'material-darker' : 'default');
  });
  observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
  return editor;
}

function fileToBase64(file) {
  return new Promise(function(resolve, reject) {
    var r = new FileReader();
    r.onload = function() { resolve(r.result); };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// ═══════════════════════════════════════════════════════════════════════════
//  🖼️ IMAGE TOOLS
// ═══════════════════════════════════════════════════════════════════════════

function imageUploadWorkspace(operation, extraFields, onSubmit) {
  var ws = document.getElementById('tool-workspace');
  ws.innerHTML = '<div class="space-y-4"><div class="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl p-6 sm:p-8 text-center cursor-pointer hover:border-indigo-400 transition" id="drop-zone"><i class="fas fa-cloud-upload-alt text-3xl sm:text-4xl text-gray-300 mb-3"></i><p class="text-sm sm:text-base text-gray-500">Drop an image here or click to upload</p><input type="file" id="tool-file-input" accept="image/*" class="hidden"></div>' +
    (extraFields || '') +
    '<div id="tool-preview" class="hidden space-y-3"><div class="flex flex-col sm:flex-row gap-3"><div class="flex-1"><p class="text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">Original</p><img id="orig-preview" class="w-full rounded-xl border border-gray-200 dark:border-gray-600 max-h-64 object-contain bg-gray-50"></div><div class="flex-1"><p class="text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">Result</p><img id="result-preview" class="w-full rounded-xl border border-gray-200 dark:border-gray-600 max-h-64 object-contain bg-gray-50 hidden"><div id="result-spinner" class="flex items-center justify-center h-32 text-gray-400"><i class="fas fa-spinner fa-spin text-2xl"></i></div></div></div><div class="flex gap-2 flex-wrap"><button id="download-btn" class="hidden px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-medium hover:bg-indigo-700 transition"><i class="fas fa-download"></i> Download</button><span id="size-info" class="text-xs text-gray-400 self-center"></span></div></div></div>';

  var dropZone = document.getElementById('drop-zone');
  var fileInput = document.getElementById('tool-file-input');
  dropZone.addEventListener('click', function() { fileInput.click(); });
  dropZone.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('border-indigo-500'); });
  dropZone.addEventListener('dragleave', function() { this.classList.remove('border-indigo-500'); });
  dropZone.addEventListener('drop', function(e) { e.preventDefault(); this.classList.remove('border-indigo-500'); if (e.dataTransfer.files.length) fileInput.files = e.dataTransfer.files; fileInput.dispatchEvent(new Event('change')); });

  fileInput.addEventListener('change', function() {
    if (!this.files.length) return;
    var file = this.files[0];
    var reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('orig-preview').src = e.target.result;
      document.getElementById('tool-preview').classList.remove('hidden');
      document.getElementById('result-spinner').classList.remove('hidden');
      document.getElementById('result-preview').classList.add('hidden');
      document.getElementById('download-btn').classList.add('hidden');
      document.getElementById('size-info').textContent = '';

      var fd = new FormData();
      fd.append('file', file);
      if (onSubmit) onSubmit(fd);

      fetch('/tools/api/image/' + operation, { method:'POST', body:fd })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          document.getElementById('result-spinner').classList.add('hidden');
          if (data.error) { document.getElementById('result-preview').classList.remove('hidden'); document.getElementById('result-preview').src = ''; alert(data.error); return; }
          var imgUrl = data.image || data.file;
          if (imgUrl) {
            document.getElementById('result-preview').classList.remove('hidden');
            document.getElementById('result-preview').src = imgUrl;
            document.getElementById('download-btn').classList.remove('hidden');
            document.getElementById('download-btn').onclick = function() { downloadData('output.' + (operation === 'to_pdf' ? 'pdf' : 'png'), imgUrl); };
            if (data.size) document.getElementById('size-info').textContent = (data.size / 1024).toFixed(1) + ' KB';
          }
        })
        .catch(function(err) { document.getElementById('result-spinner').classList.add('hidden'); alert('Error: ' + err.message); });
    };
    reader.readAsDataURL(file);
  });
}

window.tool_security_uuid = function() {
  var ws = document.getElementById('tool-workspace');
  ws.innerHTML = '<div class="space-y-4 max-w-lg"><div class="flex gap-2 flex-wrap"><button id="uuid-v4" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm hover:bg-indigo-700 transition">UUID v4</button><button id="uuid-v1" class="px-4 py-2 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-xl text-sm hover:bg-gray-300 dark:hover:bg-gray-500 transition">UUID v1 (random)</button><button id="uuid-nano" class="px-4 py-2 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-xl text-sm hover:bg-gray-300 dark:hover:bg-gray-500 transition">Short Token</button></div><div class="space-y-2" id="uuid-list"></div><button onclick="document.getElementById(\'uuid-list\').innerHTML=\'\'" class="text-sm text-gray-400 hover:text-gray-600">Clear</button></div>';

  function genUuid() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
      var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  function genToken(len) {
    var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    var result = '';
    for (var i = 0; i < len; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
    return result;
  }

  function addUuid(val) {
    var list = document.getElementById('uuid-list');
    var div = document.createElement('div');
    div.className = 'flex items-center gap-2 p-2 bg-gray-50 dark:bg-gray-700 rounded-lg text-sm font-mono';
    div.innerHTML = '<span class="flex-1 break-all">' + val + '</span><button onclick="navigator.clipboard.writeText(\'' + val + '\');showToast(\'Copied\')" class="text-indigo-500 hover:text-indigo-700 p-1"><i class="fas fa-copy"></i></button>';
    list.prepend(div);
  }

  document.getElementById('uuid-v4').addEventListener('click', function() { addUuid(genUuid()); });
  document.getElementById('uuid-v1').addEventListener('click', function() { addUuid(genUuid().replace(/4/g, '1')); });
  document.getElementById('uuid-nano').addEventListener('click', function() { addUuid(genToken(16)); });
};

window.tool_text_case = function() {
  var ws = document.getElementById('tool-workspace');
  ws.innerHTML = '<div class="space-y-4 max-w-2xl"><textarea id="case-input" rows="5" placeholder="Enter text..." class="w-full px-4 py-3 text-sm border rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white"></textarea><div class="flex flex-wrap gap-2"><button onclick="transformCase(\'upper\')" class="px-3 py-1.5 text-xs bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">UPPER CASE</button><button onclick="transformCase(\'lower\')" class="px-3 py-1.5 text-xs bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-lg hover:bg-gray-300 dark:hover:bg-gray-500 transition">lower case</button><button onclick="transformCase(\'title\')" class="px-3 py-1.5 text-xs bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-lg hover:bg-gray-300 dark:hover:bg-gray-500 transition">Title Case</button><button onclick="transformCase(\'camel\')" class="px-3 py-1.5 text-xs bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-lg hover:bg-gray-300 dark:hover:bg-gray-500 transition">camelCase</button><button onclick="transformCase(\'toggle\')" class="px-3 py-1.5 text-xs bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-lg hover:bg-gray-300 dark:hover:bg-gray-500 transition">tOGGLE cASE</button><button onclick="transformCase(\'sentence\')" class="px-3 py-1.5 text-xs bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-lg hover:bg-gray-300 dark:hover:bg-gray-500 transition">Sentence case</button></div><textarea id="case-output" rows="5" placeholder="Result..." readonly class="w-full px-4 py-3 text-sm border rounded-xl bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white"></textarea></div>';

  window.transformCase = function(mode) {
    var input = document.getElementById('case-input').value;
    var output = '';
    switch (mode) {
      case 'upper': output = input.toUpperCase(); break;
      case 'lower': output = input.toLowerCase(); break;
      case 'title': output = input.replace(/\w\S*/g, function(w) { return w[0].toUpperCase() + w.slice(1).toLowerCase(); }); break;
      case 'camel': output = input.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g, function(m, c) { return c.toUpperCase(); }); break;
      case 'toggle': output = input.split('').map(function(c) { return c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase(); }).join(''); break;
      case 'sentence': output = input.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, function(c) { return c.toUpperCase(); }); break;
    }
    document.getElementById('case-output').value = output;
  };
};

function aiToolWorkspace(operation, placeholder, extraFields) {
  var ws = document.getElementById('tool-workspace');
  ws.innerHTML = '<div class="space-y-4 max-w-2xl">' + (extraFields || '') + '<textarea id="ai-input" rows="6" placeholder="' + placeholder + '" class="w-full px-4 py-3 text-sm border rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white"></textarea><button class="ai-btn px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-medium hover:bg-indigo-700 transition"><i class="fas fa-magic"></i> Process</button><div id="ai-result" class="hidden p-4 bg-gray-50 dark:bg-gray-700 rounded-xl text-sm whitespace-pre-wrap"></div></div>';

  ws.querySelector('.ai-btn').addEventListener('click', function() {
    var text = document.getElementById('ai-input').value;
    if (!text) return;
    var btn = this; btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
    var body = {text: text};
    var langSel = document.getElementById('ai-lang');
    if (langSel) body.language = langSel.value;

    fetch('/tools/api/ai/' + operation, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    }).then(function(r) { return r.json(); }).then(function(data) {
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-magic"></i> Process';
      var r = document.getElementById('ai-result');
      if (data.success) { r.textContent = data.result; r.classList.remove('hidden'); }
      else { alert(data.error); }
    }).catch(function() { btn.disabled = false; btn.innerHTML = '<i class="fas fa-magic"></i> Process'; alert('Error'); });
  });
}

      '<div class="md:col-span-2"><label class="text-xs font-medium text-gray-600 dark:text-gray-400">Target Language</label><select id="tl-target" class="w-full px-3 py-2 text-sm border rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white mt-1"><option value="English">English</option><option value="Arabic" selected>العربية</option><option value="French">Français</option><option value="Spanish">Español</option><option value="German">Deutsch</option><option value="Chinese">中文</option><option value="Japanese">日本語</option><option value="Russian">Русский</option><option value="Portuguese">Português</option><option value="Hindi">हिन्दी</option><option value="Italian">Italiano</option><option value="Korean">한국어</option><option value="Turkish">Türkçe</option><option value="Dutch">Nederlands</option><option value="Polish">Polski</option></select></div>' +
      '<div class="md:col-span-1"><label class="text-xs font-medium text-gray-600 dark:text-gray-400">Style</label><select id="tl-style" class="w-full px-3 py-2 text-sm border rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white mt-1"><option value="standard">Standard</option><option value="formal">Formal</option><option value="casual">Casual</option></select></div>' +
    '</div>' +
    '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">' +
      '<div><label class="text-xs font-medium text-gray-600 dark:text-gray-400 mb-1 block">Input</label><textarea id="tl-input" rows="6" placeholder="Type or paste text to translate..." class="w-full px-4 py-3 text-sm border rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white"></textarea><span class="text-xs text-gray-400" id="tl-chars">0 characters</span></div>' +
      '<div><label class="text-xs font-medium text-gray-600 dark:text-gray-400 mb-1 block">Translation</label><div class="relative"><textarea id="tl-output" rows="6" readonly placeholder="Translation will appear here..." class="w-full px-4 py-3 text-sm border rounded-xl bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white"></textarea><div id="tl-spinner" class="absolute top-2 right-2 hidden"><i class="fas fa-spinner fa-spin text-indigo-500"></i></div></div><div class="flex gap-2 mt-2"><button onclick="copyResult(\'tl-output\')" class="text-xs px-3 py-1.5 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition"><i class="fas fa-copy"></i> Copy</button><button onclick="document.getElementById(\'tl-output\').value=\'\'" class="text-xs px-3 py-1.5 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition"><i class="fas fa-times"></i> Clear</button></div></div>' +
    '</div>' +
  '</div>';

  var translateTimer;
  function doTranslate() {
    var text = document.getElementById('tl-input').value.trim();
    if (!text) { document.getElementById('tl-output').value = ''; document.getElementById('tl-spinner').classList.add('hidden'); return; }
    document.getElementById('tl-chars').textContent = text.length + ' characters';
    document.getElementById('tl-spinner').classList.remove('hidden');
    var style = document.getElementById('tl-style').value;
    var stylePrompt = style === 'formal' ? ' Use formal language.' : style === 'casual' ? ' Use casual, conversational language.' : '';
    var sourceLang = document.getElementById('tl-source').value;
    var targetLang = document.getElementById('tl-target').value;
    var sourceInfo = sourceLang === 'auto' ? '(auto-detected)' : 'from ' + sourceLang;
    var prompt = 'Translate the following text ' + sourceInfo + ' to ' + targetLang + '. Only return the translation.' + stylePrompt + '\n\n' + text;
    fetch('/tools/api/ai/translate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text: text, language: targetLang, source: sourceLang, style: style})
    }).then(function(r){ return r.json(); }).then(function(data){
      document.getElementById('tl-spinner').classList.add('hidden');
      if (data.success) { document.getElementById('tl-output').value = data.result; }
    }).catch(function(){ document.getElementById('tl-spinner').classList.add('hidden'); });
  }

  document.getElementById('tl-input').addEventListener('input', function() {
    clearTimeout(translateTimer);
    translateTimer = setTimeout(doTranslate, 400);
  });
  document.getElementById('tl-source').addEventListener('change', doTranslate);
  document.getElementById('tl-target').addEventListener('change', doTranslate);
  document.getElementById('tl-style').addEventListener('change', doTranslate);
  document.getElementById('tl-swap').addEventListener('click', function() {
    var src = document.getElementById('tl-source');
    var tgt = document.getElementById('tl-target');
    if (src.value === 'auto') return;
    var tmp = src.value; src.value = tgt.value; tgt.value = tmp;
    var input = document.getElementById('tl-input');
    var output = document.getElementById('tl-output');
    if (output.value) { input.value = output.value; output.value = ''; }
    doTranslate();
  });
};

function devToolWorkspace(lang, label, inputPlaceholder, outputLabel, compileFn) {
  var ws = document.getElementById('tool-workspace');
  var langLabel = label || lang;
  ws.innerHTML = '<div class="space-y-4">' +
    '<div class="flex items-center gap-3 flex-wrap">' +
      '<span class="text-xs font-semibold bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-3 py-1 rounded-lg">' + langLabel + '</span>' +
      '<button id="dev-compile-btn" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-medium hover:bg-indigo-700 transition"><i class="fas fa-play"></i> Compile</button>' +
      '<button id="dev-clear-btn" class="px-4 py-2 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-xl text-sm hover:bg-gray-300 dark:hover:bg-gray-500 transition"><i class="fas fa-trash"></i> Clear</button>' +
    '</div>' +
    '<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">' +
      '<div><label class="text-xs font-medium text-gray-600 dark:text-gray-400 mb-1 block">' + (inputPlaceholder || 'Input') + '</label><textarea id="dev-input" rows="12" placeholder="' + (inputPlaceholder || 'Enter code...') + '" class="w-full px-4 py-3 text-sm font-mono border rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white"></textarea></div>' +
      '<div><label class="text-xs font-medium text-gray-600 dark:text-gray-400 mb-1 block">' + (outputLabel || 'Output') + '</label><pre id="dev-output" class="w-full h-[308px] overflow-auto px-4 py-3 text-sm font-mono border rounded-xl bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white whitespace-pre-wrap break-all"><span class="text-gray-400">Compiled output will appear here...</span></pre><div class="flex gap-2 mt-2"><button onclick="copyResult(\'dev-output\')" class="text-xs px-3 py-1.5 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition"><i class="fas fa-copy"></i> Copy</button></div></div>' +
    '</div>' +
  '</div>';

  document.getElementById('dev-compile-btn').addEventListener('click', function() {
    var code = document.getElementById('dev-input').value;
    if (!code.trim()) return;
    var btn = this; btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Compiling...';
    compileFn(code, function(result, err) {
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-play"></i> Compile';
      var out = document.getElementById('dev-output');
      if (err) { out.innerHTML = '<span class="text-red-500">Error: ' + escapeHtml(err) + '</span>'; return; }
      out.textContent = result;
      // Syntax highlight output using Prism
      if (typeof Prism !== 'undefined') {
        var langClass = (lang === 'sass' || lang === 'less') ? 'language-css' : lang === 'pug' ? 'language-html' : 'language-javascript';
        out.innerHTML = Prism.highlight(result, Prism.languages[langClass.replace('language-', '')] || Prism.languages.javascript, langClass.replace('language-', ''));
      }
    });
  });
  document.getElementById('dev-clear-btn').addEventListener('click', function() {
    document.getElementById('dev-input').value = '';
    document.getElementById('dev-output').innerHTML = '<span class="text-gray-400">Compiled output will appear here...</span>';
  });
}

window.tool_dev_formatter = function() {
  var ws = document.getElementById('tool-workspace');
  ws.innerHTML = '<div class="space-y-4 max-w-3xl">' +
    '<div class="flex items-center gap-2 flex-wrap">' +
      '<select id="fmt-lang" class="px-3 py-2 text-sm border rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white"><option value="json">JSON</option><option value="javascript">JavaScript</option><option value="html">HTML</option><option value="css">CSS</option><option value="python">Python (basic)</option></select>' +
      '<button id="fmt-btn" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-medium hover:bg-indigo-700 transition"><i class="fas fa-indent"></i> Format</button>' +
      '<button onclick="copyResult(\'fmt-input\')" class="px-4 py-2 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-xl text-sm hover:bg-gray-300 dark:hover:bg-gray-500 transition"><i class="fas fa-copy"></i> Copy</button>' +
    '</div>' +
    '<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">' +
      '<div><label class="text-xs font-medium text-gray-600 dark:text-gray-400 mb-1 block">Input</label><textarea id="fmt-input" rows="12" placeholder="Paste messy code..." class="w-full px-4 py-3 text-sm font-mono border rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white"></textarea></div>' +
      '<div><label class="text-xs font-medium text-gray-600 dark:text-gray-400 mb-1 block">Formatted</label><textarea id="fmt-output" rows="12" readonly placeholder="Formatted output..." class="w-full px-4 py-3 text-sm font-mono border rounded-xl bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white"></textarea></div>' +
    '</div>' +
  '</div>';

  document.getElementById('fmt-btn').addEventListener('click', function() {
    var input = document.getElementById('fmt-input').value;
    if (!input.trim()) return;
    var lang = document.getElementById('fmt-lang').value;
    var result = '';
    try {
      if (lang === 'json') {
        result = JSON.stringify(JSON.parse(input), null, 2);
      } else if (lang === 'javascript' || lang === 'css') {
        // Basic indentation-based formatter
        var lines = input.split('\n');
        var indent = 0;
        result = lines.map(function(l) {
          var trimmed = l.trim();
          if (!trimmed) return '';
          var dedent = /^[}\]\)]/.test(trimmed) ? 1 : 0;
          indent = Math.max(0, indent - dedent);
          var out = '  '.repeat(indent) + trimmed;
          if (/[\[{\(]$/.test(trimmed)) indent++;
          return out;
        }).join('\n');
      } else if (lang === 'html') {
        // Basic HTML indentation
        var tags = input.replace(/>\s*</g, '>\n<').split('\n');
        var indent = 0;
        result = tags.map(function(l) {
          var trimmed = l.trim();
          if (!trimmed) return '';
          var dedent = trimmed.startsWith('</') ? 1 : 0;
          indent = Math.max(0, indent - dedent);
          var out = '  '.repeat(indent) + trimmed;
          if (/<[^/][^>]*>[^<]*$/.test(trimmed) && !trimmed.endsWith('/>') && !trimmed.startsWith('</')) indent++;
          return out;
        }).join('\n');
      } else if (lang === 'python') {
        result = input.split('\n').map(function(l) { return l.trimEnd(); }).join('\n');
      }
      document.getElementById('fmt-output').value = result || input;
    } catch(e) {
      document.getElementById('fmt-output').value = 'Error: ' + e.message;
    }
  });
};
