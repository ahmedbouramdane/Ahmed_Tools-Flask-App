// ═══════════════════════════════════════════════════════════════════════════
//  APP STATE
// ═══════════════════════════════════════════════════════════════════════════

var currentCat = 'image';
var currentTool = null;

// ═══════════════════════════════════════════════════════════════════════════
//  CATEGORY TABS
// ═══════════════════════════════════════════════════════════════════════════

document.getElementById('category-tabs').addEventListener('click', function(e) {
  var tab = e.target.closest('.cat-tab');
  if (!tab) return;
  currentCat = tab.dataset.cat;
  currentTool = null;
  this.querySelectorAll('.cat-tab').forEach(function(t) {
    t.classList.remove('active', 'bg-indigo-600', 'text-white');
    t.classList.add('bg-gray-100', 'dark:bg-gray-700', 'text-gray-600', 'dark:text-gray-300');
  });
  tab.classList.remove('bg-gray-100', 'dark:bg-gray-700', 'text-gray-600', 'dark:text-gray-300');
  tab.classList.add('bg-indigo-600', 'text-white');
  renderToolGrid();
});

// ═══════════════════════════════════════════════════════════════════════════
//  RENDER TOOL GRID
// ═══════════════════════════════════════════════════════════════════════════

function renderToolGrid() {
  // Cleanup any running tool
  if (window._cleanupCanva) { window._cleanupCanva(); }
  if (window._cleanupCalc) { window._cleanupCalc(); }
  if (window._cleanupPlayground) { window._cleanupPlayground(); }

  var tools = TOOLS[currentCat] || [];
  var container = document.getElementById('tools-content');
  container.innerHTML = '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">' +
    tools.map(function(t) {
      return '<div class="tool-card bg-white dark:bg-gray-800 rounded-xl shadow-md border border-gray-100 dark:border-gray-700 p-4 sm:p-5 cursor-pointer hover:shadow-lg hover:border-indigo-300 dark:hover:border-indigo-600 hover:-translate-y-0.5 transition-all duration-200" data-tool="' + t.id + '">' +
        '<div class="flex items-center gap-3 sm:gap-4 mb-2 sm:mb-3">' +
        '<div class="w-10 h-10 sm:w-12 sm:h-12 shrink-0 rounded-xl bg-' + t.color + '-100 dark:bg-' + t.color + '-900/30 flex items-center justify-center"><i class="' + t.icon + ' text-base sm:text-lg text-' + t.color + '-600 dark:text-' + t.color + '-400"></i></div>' +
        '<h3 class="text-sm sm:text-base font-bold text-gray-800 dark:text-white">' + t.title + '</h3></div>' +
        '<p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 leading-relaxed line-clamp-2">' + t.desc + '</p>' +
      '</div>';
    }).join('') + '</div>';

  container.querySelectorAll('.tool-card').forEach(function(card) {
    card.addEventListener('click', function() {
      var id = this.dataset.tool;
      var tool = TOOLS[currentCat].find(function(t) { return t.id === id; });
      if (tool) openTool(tool);
    });
  });
}

// ═══════════════════════════════════════════════════════════════════════════
//  OPEN TOOL
// ═══════════════════════════════════════════════════════════════════════════

function openTool(tool) {
  currentTool = tool;
  if (window._cleanupCanva) { window._cleanupCanva(); }
  if (window._cleanupCalc) { window._cleanupCalc(); }
  if (window._cleanupPlayground) { window._cleanupPlayground(); }
  var container = document.getElementById('tools-content');
  container.innerHTML = '<div class="mb-4 flex items-center gap-3">' +
    '<button onclick="renderToolGrid()" class="p-2 text-gray-500 hover:text-indigo-600 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition"><i class="fas fa-arrow-left"></i></button>' +
    '<div><h3 class="text-lg sm:text-xl font-bold text-gray-800 dark:text-white"><i class="' + tool.icon + ' mr-2"></i>' + tool.title + '</h3>' +
    '<p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400">' + tool.desc + '</p></div></div><div id="tool-workspace" class="bg-white dark:bg-gray-800 rounded-xl sm:rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-4 sm:p-6"></div>';

  var fnName = 'tool_' + currentCat + '_' + tool.id.replace(/-/g, '_');
  if (typeof window[fnName] === 'function') {
    window[fnName]();
  } else {
    document.getElementById('tool-workspace').innerHTML = '<p class="text-gray-400 text-center py-8">Tool interface coming soon</p>';
  }
}

// ═══════════════════════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════════════════════

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function loadScript(url) {
  return new Promise(function(resolve, reject) {
    // Check if already loaded via the script's src
    var scripts = document.querySelectorAll('script[src="' + url.replace(/"/g, '\\"') + '"]');
    if (scripts.length) { resolve(); return; }
    var s = document.createElement('script');
    s.src = url;
    s.onload = resolve;
    s.onerror = function() { reject(new Error('Failed to load ' + url)); };
    document.body.appendChild(s);
  });
}

function compileFallback(code, lang, done) {
  fetch('/tools/api/dev/compile', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({language: lang, code: code})
  }).then(function(r){ return r.json(); }).then(function(d){
    if (d.success) done(d.result, null); else done(null, d.error || 'Compilation failed');
  }).catch(function(e){ done(null, e.message); });
}

function downloadData(filename, dataUrl) {
  var a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function showToast(msg, icon) {
  if (typeof Swal !== 'undefined') {
    Swal.fire({ toast:true, position:'top-end', icon:icon||'success', title:msg, showConfirmButton:false, timer:2000 });
  }
}

function copyResult(elId) {
  var el = document.getElementById(elId);
  if (!el) return;
  if (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') {
    el.select(); el.setSelectionRange(0, 99999);
  }
  navigator.clipboard.writeText(el.value || el.textContent);
  showToast('Copied!', 'success');
}

function toggleToolFullscreen(el) {
  if (!el) el = document.getElementById('tool-workspace');
  if (!el) return;
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    el.requestFullscreen?.().catch(function(){});
  }
}

// ─── Dynamic CodeMirror loader ────────────────────────────────────────────

var _cmLoaded = false;
var _cmLoading = false;
var _cmQueue = [];

var _cmAddonsLoaded = false;
var _cmEditor = null;

function loadCodeMirror(callback) {
  if (window.CodeMirror && _cmAddonsLoaded) { callback(); return; }
  _cmQueue.push(callback);
  if (_cmLoading) return;
  _cmLoading = true;

  var cssUrls = [
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css',
  ];
  cssUrls.forEach(function(url) {
    var l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = url;
    if (url.indexOf('material-darker') > -1) l.id = 'cm-dark-theme';
    document.head.appendChild(l);
  });

  var scriptUrls = [
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/javascript-hint.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/html-hint.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/css-hint.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/xml-hint.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldcode.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/brace-fold.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/xml-fold.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/comment-fold.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js',
  ];
  var loaded = 0;
  var total = scriptUrls.length;
  function checkDone() {
    loaded++;
    if (loaded >= total) {
      _cmAddonsLoaded = true;
      _cmLoaded = true;
      _cmLoading = false;
      _cmQueue.forEach(function(fn) { fn(); });
      _cmQueue = [];
    }
  }
  scriptUrls.forEach(function(url) {
    var s = document.createElement('script');
    s.src = url;
    s.async = false;
    s.onload = checkDone;
    s.onerror = checkDone;
    document.body.appendChild(s);
  });
}

function loadCodeMirrorMode(mode, callback) {
  var modes = {
    sass: 'sass/sass.min.js',
    css: 'css/css.min.js',
    javascript: 'javascript/javascript.min.js',
    typescript: 'javascript/javascript.min.js',
    html: 'htmlmixed/htmlmixed.min.js',
    xml: 'xml/xml.min.js',
    coffeescript: 'coffeescript/coffeescript.min.js',
  };
  var suffix = modes[mode];
  if (!suffix || window['CodeMirror_' + mode]) { callback(); return; }
  var s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/' + suffix;
  s.onload = function() { window['CodeMirror_' + mode] = true; callback(); };
  document.body.appendChild(s);
}

function createCodeEditor(textareaId, mode) {
  var ta = document.getElementById(textareaId);
  if (!ta) return null;
  // Map friendly mode names to CodeMirror MIME types
  var modeMap = { typescript: 'text/typescript', jsx: 'text/jsx', coffeescript: 'text/x-coffeescript' };
  var cmMode = modeMap[mode] || mode;
  var editor = CodeMirror.fromTextArea(ta, {
    mode: cmMode,
    lineNumbers: true,
    matchBrackets: true,
    autoCloseBrackets: true,
    tabSize: 2,
    indentUnit: 2,
    indentWithTabs: false,
    theme: document.documentElement.classList.contains('dark') ? 'material-darker' : 'default',
    viewportMargin: Infinity,
    styleActiveLine: true,
    foldGutter: true,
    gutters: ['CodeMirror-linenumbers', 'CodeMirror-foldgutter'],
    hintOptions: {
      completeSingle: false,
      closeOnUnfocus: true,
      alignWithWord: true
    },
    extraKeys: {
      'Ctrl-Space': 'autocomplete',
      'Ctrl-S': function(ed) { ed.execCommand('insertSoftTab'); }
    }
  });

  editor.on('inputRead', function(ed, change) {
    if (change.text && change.text.length === 1 && /[\w.$]$/.test(change.text[0])) {
      ed.showHint();
    }
  });

  _cmEditor = editor;

  // Watch for theme changes
  var observer = new MutationObserver(function() {
    editor.setOption('theme', document.documentElement.classList.contains('dark') ? 'material-darker' : 'default');
  });
  observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
  return editor;
}

function fileToBase64(file) {
  return new Promise(function(resolve, reject) {
    var r = new FileReader();
    r.onload = function() { resolve(r.result); };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

  function processImage() {
    if (!_imageCurrentFile) return;
    document.getElementById('result-spinner').classList.remove('hidden');
    var fd = new FormData();
    fd.append('file', _imageCurrentFile);
    if (onSubmit) onSubmit(fd);
    fetch('/tools/api/image/' + operation, { method:'POST', body:fd })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        document.getElementById('result-spinner').classList.add('hidden');
        if (data.error) { return; }
        var imgUrl = data.image || data.file;
        if (imgUrl) {
          document.getElementById('result-preview').src = imgUrl;
          document.getElementById('download-btn').classList.remove('hidden');
          document.getElementById('download-btn').onclick = function() { downloadData('output.' + (operation === 'to_pdf' ? 'pdf' : 'png'), imgUrl); };
          if (data.size) {
            document.getElementById('size-info').textContent = (data.size / 1024).toFixed(1) + ' KB';
            document.getElementById('result-size').textContent = (data.size / 1024).toFixed(1) + ' KB';
          }
          document.getElementById('compare-btn').classList.remove('hidden');
        }
      })
      .catch(function() { document.getElementById('result-spinner').classList.add('hidden'); });
  }

  var dropZone = document.getElementById('drop-zone');
  var fileInput = document.getElementById('tool-file-input');
  dropZone.addEventListener('click', function() { fileInput.click(); });
  dropZone.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('border-indigo-500'); });
  dropZone.addEventListener('dragleave', function() { this.classList.remove('border-indigo-500'); });
  dropZone.addEventListener('drop', function(e) { e.preventDefault(); this.classList.remove('border-indigo-500'); if (e.dataTransfer.files.length) fileInput.files = e.dataTransfer.files; fileInput.dispatchEvent(new Event('change')); });

  // Compare toggle
  setTimeout(function() {
    var compareBtn = document.getElementById('compare-btn');
    if (compareBtn) {
      compareBtn.addEventListener('click', function() {
        var orig = document.getElementById('orig-preview');
        var result = document.getElementById('result-preview');
        if (orig.style.display === 'none') {
          orig.style.display = '';
          result.style.display = '';
          compareBtn.innerHTML = '<i class="fas fa-arrows-alt-h"></i> Compare';
        } else {
          orig.style.display = 'none';
          result.style.display = '';
          compareBtn.innerHTML = '<i class="fas fa-arrows-alt-h"></i> Show Original';
        }
      });
    }
  }, 0);

  fileInput.addEventListener('change', function() {
    if (!this.files.length) return;
    _imageCurrentFile = this.files[0];
    document.getElementById('orig-size').textContent = (_imageCurrentFile.size / 1024).toFixed(1) + ' KB';
    var reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('orig-preview').src = e.target.result;
      document.getElementById('tool-preview').classList.remove('hidden');
      document.getElementById('result-spinner').classList.remove('hidden');
      document.getElementById('size-info').textContent = '';
      processImage();
    };
    reader.readAsDataURL(_imageCurrentFile);
  });

  return processImage;
}

    '/static/js/design-editor/plugins/plugin-system.js',
    '/static/js/design-editor/main.js',
  ];

  var _deEditor = null;

  function loadNext(idx) {
    if (idx >= scripts.length) {
      _deEditor = new DesignEditor('de-mount');
      _deEditor.init();
      return;
    }
    var s = document.createElement('script');
    s.src = scripts[idx];

window.tool_security_uuid = function() {
  var ws = document.getElementById('tool-workspace');
  ws.innerHTML = '<div class="space-y-4 max-w-lg"><div class="flex gap-2 flex-wrap"><button id="uuid-v4" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm hover:bg-indigo-700 transition">UUID v4</button><button id="uuid-v1" class="px-4 py-2 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-xl text-sm hover:bg-gray-300 dark:hover:bg-gray-500 transition">UUID v1 (random)</button><button id="uuid-nano" class="px-4 py-2 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-xl text-sm hover:bg-gray-300 dark:hover:bg-gray-500 transition">Short Token</button></div><div class="space-y-2" id="uuid-list"></div><button onclick="document.getElementById(\'uuid-list\').innerHTML=\'\'" class="text-sm text-gray-400 hover:text-gray-600">Clear</button></div>';

  function genUuid() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
      var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  function genToken(len) {
    var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    var result = '';
    for (var i = 0; i < len; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
    return result;
  }

  function addUuid(val) {
    var list = document.getElementById('uuid-list');
    var div = document.createElement('div');
    div.className = 'flex items-center gap-2 p-2 bg-gray-50 dark:bg-gray-700 rounded-lg text-sm font-mono';
    div.innerHTML = '<span class="flex-1 break-all">' + val + '</span><button onclick="navigator.clipboard.writeText(\'' + val + '\');showToast(\'Copied\')" class="text-indigo-500 hover:text-indigo-700 p-1"><i class="fas fa-copy"></i></button>';
    list.prepend(div);
  }

  document.getElementById('uuid-v4').addEventListener('click', function() { addUuid(genUuid()); });
  document.getElementById('uuid-v1').addEventListener('click', function() { addUuid(genUuid().replace(/4/g, '1')); });
  document.getElementById('uuid-nano').addEventListener('click', function() { addUuid(genToken(16)); });
};

  ws.innerHTML = '<div class="space-y-4 max-w-2xl"><textarea id="case-input" rows="5" placeholder="Enter text..." class="w-full px-4 py-3 text-sm border rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white"></textarea><div class="flex flex-wrap gap-2"><button onclick="transformCase(\'upper\')" class="px-3 py-1.5 text-xs bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">UPPER CASE</button><button onclick="transformCase(\'lower\')" class="px-3 py-1.5 text-xs bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-lg hover:bg-gray-300 dark:hover:bg-gray-500 transition">lower case</button><button onclick="transformCase(\'title\')" class="px-3 py-1.5 text-xs bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-lg hover:bg-gray-300 dark:hover:bg-gray-500 transition">Title Case</button><button onclick="transformCase(\'camel\')" class="px-3 py-1.5 text-xs bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-lg hover:bg-gray-300 dark:hover:bg-gray-500 transition">camelCase</button><button onclick="transformCase(\'toggle\')" class="px-3 py-1.5 text-xs bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-lg hover:bg-gray-300 dark:hover:bg-gray-500 transition">tOGGLE cASE</button><button onclick="transformCase(\'sentence\')" class="px-3 py-1.5 text-xs bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-lg hover:bg-gray-300 dark:hover:bg-gray-500 transition">Sentence case</button></div><textarea id="case-output" rows="5" placeholder="Result..." readonly class="w-full px-4 py-3 text-sm border rounded-xl bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white"></textarea></div>';

  window.transformCase = function(mode) {
    var input = document.getElementById('case-input').value;
    var output = '';
    switch (mode) {
      case 'upper': output = input.toUpperCase(); break;
      case 'lower': output = input.toLowerCase(); break;
      case 'title': output = input.replace(/\w\S*/g, function(w) { return w[0].toUpperCase() + w.slice(1).toLowerCase(); }); break;
      case 'camel': output = input.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g, function(m, c) { return c.toUpperCase(); }); break;
      case 'toggle': output = input.split('').map(function(c) { return c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase(); }).join(''); break;
      case 'sentence': output = input.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, function(c) { return c.toUpperCase(); }); break;
    }
    document.getElementById('case-output').value = output;
  };
};

    var seen = {};

      return true;

  };
};

function aiToolWorkspace(operation, placeholder, extraFields) {
  var ws = document.getElementById('tool-workspace');
  ws.innerHTML = '<div class="space-y-4 max-w-2xl">' + (extraFields || '') + '<textarea id="ai-input" rows="6" placeholder="' + placeholder + '" class="w-full px-4 py-3 text-sm border rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white"></textarea><button class="ai-btn px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-medium hover:bg-indigo-700 transition"><i class="fas fa-magic"></i> Process</button><div id="ai-result" class="hidden p-4 bg-gray-50 dark:bg-gray-700 rounded-xl text-sm whitespace-pre-wrap"></div></div>';

  ws.querySelector('.ai-btn').addEventListener('click', function() {
    var text = document.getElementById('ai-input').value;
    if (!text) return;
    var btn = this; btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
    var body = {text: text};
    var langSel = document.getElementById('ai-lang');
    if (langSel) body.language = langSel.value;

    fetch('/tools/api/ai/' + operation, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    }).then(function(r) { return r.json(); }).then(function(data) {
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-magic"></i> Process';
      var r = document.getElementById('ai-result');
      if (data.success) { r.textContent = data.result; r.classList.remove('hidden'); }
      else { alert(data.error); }
    }).catch(function() { btn.disabled = false; btn.innerHTML = '<i class="fas fa-magic"></i> Process'; alert('Error'); });
  });
}

  function doTranslate() {
    var text = document.getElementById('tl-input').value.trim();
    if (!text) { document.getElementById('tl-output').value = ''; document.getElementById('tl-spinner').classList.add('hidden'); return; }
    document.getElementById('tl-chars').textContent = text.length + ' characters';

    var style = document.getElementById('tl-style').value;
    var stylePrompt = style === 'formal' ? ' Use formal language.' : style === 'casual' ? ' Use casual, conversational language.' : '';
    var sourceLang = document.getElementById('tl-source').value;
    var targetLang = document.getElementById('tl-target').value;
    var sourceInfo = sourceLang === 'auto' ? '(auto-detected)' : 'from ' + sourceLang;
    var prompt = 'Translate the following text ' + sourceInfo + ' to ' + targetLang + '. Only return the translation.' + stylePrompt + '\n\n' + text;
    fetch('/tools/api/ai/translate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text: text, language: targetLang, source: sourceLang, style: style})
    }).then(function(r){ return r.json(); }).then(function(data){

    }).catch(function(){ document.getElementById('tl-spinner').classList.add('hidden'); });
  }

  document.getElementById('tl-input').addEventListener('input', function() {
    clearTimeout(translateTimer);
    translateTimer = setTimeout(doTranslate, 400);
  });
  document.getElementById('tl-source').addEventListener('change', doTranslate);
  document.getElementById('tl-target').addEventListener('change', doTranslate);

    if (output.value) { input.value = output.value; output.value = ''; }
    doTranslate();
  });
};

function devToolWorkspace(lang, label, inputPlaceholder, outputLabel, compileFn) {
  var ws = document.getElementById('tool-workspace');
  var langLabel = label || lang;
  ws.innerHTML = '<div class="space-y-4">' +
    '<div class="flex items-center gap-3 flex-wrap">' +
      '<span class="text-xs font-semibold bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-3 py-1 rounded-lg">' + langLabel + '</span>' +
      '<button id="dev-compile-btn" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-medium hover:bg-indigo-700 transition"><i class="fas fa-play"></i> Compile</button>' +
      '<button id="dev-clear-btn" class="px-4 py-2 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-xl text-sm hover:bg-gray-300 dark:hover:bg-gray-500 transition"><i class="fas fa-trash"></i> Clear</button>' +
    '</div>' +
    '<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">' +
      '<div><label class="text-xs font-medium text-gray-600 dark:text-gray-400 mb-1 block">' + (inputPlaceholder || 'Input') + '</label><textarea id="dev-input" rows="12" placeholder="' + (inputPlaceholder || 'Enter code...') + '" class="w-full px-4 py-3 text-sm font-mono border rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white"></textarea></div>' +
      '<div><label class="text-xs font-medium text-gray-600 dark:text-gray-400 mb-1 block">' + (outputLabel || 'Output') + '</label><pre id="dev-output" class="w-full h-[308px] overflow-auto px-4 py-3 text-sm font-mono border rounded-xl bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white whitespace-pre-wrap break-all"><span class="text-gray-400">Compiled output will appear here...</span></pre><div class="flex gap-2 mt-2"><button onclick="copyResult(\'dev-output\')" class="text-xs px-3 py-1.5 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition"><i class="fas fa-copy"></i> Copy</button></div></div>' +
    '</div>' +
  '</div>';

  document.getElementById('dev-compile-btn').addEventListener('click', function() {
    var code = _cmEditor ? _cmEditor.getValue() : document.getElementById('dev-input').value;
    if (!code.trim()) return;
    var btn = this; btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Compiling...';
    compileFn(code, function(result, err) {
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-play"></i> Compile';
      var out = document.getElementById('dev-output');
      if (err) { out.innerHTML = '<span class="text-red-500">Error: ' + escapeHtml(err) + '</span>'; return; }
      // Syntax highlight output using Prism
      if (typeof Prism !== 'undefined') {
        var langName = (lang === 'sass' || lang === 'less') ? 'css' : lang === 'pug' ? 'html' : 'javascript';
        var grammar = Prism.languages[langName];
        if (grammar) {
          out.innerHTML = Prism.highlight(result, grammar, langName);
        } else if (Prism.plugins && Prism.plugins.autoloader && Prism.plugins.autoloader.loadLanguages) {
          Prism.plugins.autoloader.loadLanguages(langName, function() {
            out.innerHTML = Prism.highlight(result, Prism.languages[langName] || Prism.languages.javascript, langName);
          });
        } else {
          out.textContent = result;
        }
      } else {
        out.textContent = result;
      }
    });
  });
  document.getElementById('dev-clear-btn').addEventListener('click', function() {
    if (_cmEditor) { _cmEditor.setValue(''); } else { document.getElementById('dev-input').value = ''; }
    document.getElementById('dev-output').innerHTML = '<span class="text-gray-400">Compiled output will appear here...</span>';
  });
}

window.tool_dev_formatter = function() {
  var ws = document.getElementById('tool-workspace');
  ws.innerHTML = '<div class="space-y-4 max-w-3xl">' +
    '<div class="flex items-center gap-2 flex-wrap">' +
      '<select id="fmt-lang" class="px-3 py-2 text-sm border rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white"><option value="json">JSON</option><option value="javascript">JavaScript</option><option value="html">HTML</option><option value="css">CSS</option><option value="python">Python (basic)</option></select>' +
      '<button id="fmt-btn" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-medium hover:bg-indigo-700 transition"><i class="fas fa-indent"></i> Format</button>' +
      '<button onclick="copyResult(\'fmt-input\')" class="px-4 py-2 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-xl text-sm hover:bg-gray-300 dark:hover:bg-gray-500 transition"><i class="fas fa-copy"></i> Copy</button>' +
    '</div>' +
    '<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">' +
      '<div><label class="text-xs font-medium text-gray-600 dark:text-gray-400 mb-1 block">Input</label><textarea id="fmt-input" rows="12" placeholder="Paste messy code..." class="w-full px-4 py-3 text-sm font-mono border rounded-xl bg-white dark:bg-gray-700 text-gray-800 dark:text-white"></textarea></div>' +
      '<div><label class="text-xs font-medium text-gray-600 dark:text-gray-400 mb-1 block">Formatted</label><textarea id="fmt-output" rows="12" readonly placeholder="Formatted output..." class="w-full px-4 py-3 text-sm font-mono border rounded-xl bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white"></textarea></div>' +
    '</div>' +
  '</div>';

  document.getElementById('fmt-btn').addEventListener('click', function() {
    var input = document.getElementById('fmt-input').value;
    if (!input.trim()) return;
    var lang = document.getElementById('fmt-lang').value;
    var result = '';
    try {
      if (lang === 'json') {
        result = JSON.stringify(JSON.parse(input), null, 2);
      } else if (lang === 'javascript' || lang === 'css') {
        // Basic indentation-based formatter
        var lines = input.split('\n');
        var indent = 0;
        result = lines.map(function(l) {
          var trimmed = l.trim();
          if (!trimmed) return '';
          var dedent = /^[}\]\)]/.test(trimmed) ? 1 : 0;
          indent = Math.max(0, indent - dedent);
          var out = '  '.repeat(indent) + trimmed;
          if (/[\[{\(]$/.test(trimmed)) indent++;
          return out;
        }).join('\n');
      } else if (lang === 'html') {
        // Basic HTML indentation
        var tags = input.replace(/>\s*</g, '>\n<').split('\n');
        var indent = 0;
        result = tags.map(function(l) {
          var trimmed = l.trim();
          if (!trimmed) return '';
          var dedent = trimmed.startsWith('</') ? 1 : 0;
          indent = Math.max(0, indent - dedent);
          var out = '  '.repeat(indent) + trimmed;
          if (/<[^/][^>]*>[^<]*$/.test(trimmed) && !trimmed.endsWith('/>') && !trimmed.startsWith('</')) indent++;
          return out;
        }).join('\n');
      } else if (lang === 'python') {
        result = input.split('\n').map(function(l) { return l.trimEnd(); }).join('\n');
      }
      document.getElementById('fmt-output').value = result || input;
    } catch(e) {
      document.getElementById('fmt-output').value = 'Error: ' + e.message;
    }
  });
};

  // ── Load CodeMirror with LaTeX mode ───────────────────────────────────
  loadCodeMirror(function() {
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/stex/stex.min.js').then(function() {
      _latexEditor = CodeMirror.fromTextArea(_latexTa, {
        mode: 'stex',
        lineNumbers: true,
        matchBrackets: true,
        autoCloseBrackets: true,
        tabSize: 2,
        indentUnit: 2,
        indentWithTabs: false,
        theme: document.documentElement.classList.contains('dark') ? 'material-darker' : 'default',
        viewportMargin: Infinity,
        styleActiveLine: true,
        foldGutter: true,
        gutters: ['CodeMirror-linenumbers', 'CodeMirror-foldgutter'],
        extraKeys: {
          'Ctrl-Space': function(cm) { cm.showHint({ completeSingle: false }); },
          'Tab': function(cm) { cm.execCommand('insertSoftTab'); }
        },
        hintOptions: { completeSingle: false, closeOnUnfocus: true }
      });

      // Autocomplete for LaTeX commands
      var latexHints = [
        '\\frac', '\\sqrt', '\\sum', '\\int', '\\iint', '\\prod', '\\lim',
        '\\log', '\\ln', '\\sin', '\\cos', '\\tan', '\\cot', '\\sec', '\\csc',
        '\\arcsin', '\\arccos', '\\arctan', '\\sinh', '\\cosh', '\\tanh',
        '\\alpha', '\\beta', '\\gamma', '\\delta', '\\epsilon', '\\zeta',
        '\\eta', '\\theta', '\\iota', '\\kappa', '\\lambda', '\\mu', '\\nu',
        '\\xi', '\\pi', '\\rho', '\\sigma', '\\tau', '\\upsilon', '\\phi',
        '\\chi', '\\psi', '\\omega', '\\Gamma', '\\Delta', '\\Theta',
        '\\Lambda', '\\Xi', '\\Pi', '\\Sigma', '\\Phi', '\\Psi', '\\Omega',
        '\\times', '\\div', '\\pm', '\\mp', '\\cdot', '\\circ', '\\ast',
        '\\star', '\\infty', '\\partial', '\\nabla', '\\hbar', '\\ell',
        '\\Im', '\\Re', '\\approx', '\\neq', '\\equiv', '\\leq', '\\geq',
        '\\subset', '\\supset', '\\subseteq', '\\supseteq', '\\cup', '\\cap',
        '\\emptyset', '\\forall', '\\exists', '\\in', '\\notin', '\\to',
        '\\mapsto', '\\rightarrow', '\\leftarrow', '\\Rightarrow', '\\Leftarrow',
        '\\Leftrightarrow', '\\uparrow', '\\downarrow', '\\binom', '\\underset',
        '\\overset', '\\text', '\\mathbf', '\\mathit', '\\mathrm', '\\mathcal',
        '\\mathbb', '\\mathfrak', '\\widetilde', '\\widehat', '\\bar', '\\dot',
        '\\ddot', '\\hat', '\\tilde', '\\vec', '\\overline', '\\underline',
        '\\begin', '\\end', '\\documentclass', '\\usepackage', '\\section',
        '\\subsection', '\\subsubsection', '\\chapter', '\\paragraph',
        '\\label', '\\ref', '\\cite', '\\pageref', '\\footnote', '\\item',
        '\\textbf', '\\textit', '\\emph', '\\underline', '\\textcolor',
      ];
      var hintSource = function(cm, opt) {
        var cur = cm.getCursor(), line = cm.getLine(cur.line);
        var before = line.slice(0, cur.ch);
        var m = before.match(/(\\[a-zA-Z]*)$/);
        if (!m) return;
        var prefix = m[1];
        var matches = latexHints.filter(function(h) { return h.startsWith(prefix) && h !== prefix; });
        return { list: matches.map(function(h) { return { text: h, displayText: h }; }), from: { line: cur.line, ch: cur.ch - prefix.length }, to: cur };
      };
      CodeMirror.registerHelper('hint', 'latex', hintSource);
      _latexEditor.on('inputRead', function(cm, change) {
        if (change.text && change.text.length === 1 && change.text[0] === '\\') {
          cm.showHint({ hint: hintSource, completeSingle: false });
        }
      });

      function updateLineCount() { var txt = _latexEditor.getValue(); document.getElementById('latex-line-count').textContent = txt ? '(' + _latexEditor.lineCount() + ' lines)' : ''; }
      _latexEditor.on('change', function() { updateLineCount(); scheduleRender(); });

      updateLineCount();
      setTimeout(renderLatex, 100);

      var obs = new MutationObserver(function() {
        _latexEditor.setOption('theme', document.documentElement.classList.contains('dark') ? 'material-darker' : 'default');
      });
      obs.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    });
  });

  // ── Get current LaTeX code (from CodeMirror or textarea fallback) ───
  function getLatexCode() {
    if (_latexEditor) return _latexEditor.getValue();
    if (_latexTa) return _latexTa.value;
    return '';
  }

  // ── Render LaTeX preview ─────────────────────────────────────────────
  function renderLatex() {
    var code = getLatexCode().trim();
    var preview = document.getElementById('latex-preview');
    var status = document.getElementById('latex-preview-status');
    if (!code) { preview.innerHTML = '<span class="text-gray-400 text-sm mt-8">Preview will appear here...</span>'; if(status)status.textContent=''; return; }
    if (typeof katex === 'undefined') { preview.innerHTML = '<span class="text-red-400 text-sm">KaTeX library not loaded</span>'; return; }
    try {
      preview.innerHTML = '';
      katex.render(code, preview, { displayMode: true, throwOnError: false, output: 'html' });
      if (status) status.textContent = '✓ rendered';
    } catch(e) {
      preview.innerHTML = '<span class="text-red-500 text-sm font-mono">Error: ' + escapeHtml(e.message) + '</span>';
      if (status) status.textContent = '✗ error';
    }
  }

  // Also render preview when typing directly in the textarea (CodeMirror fallback)
  if (_latexTa) {
    _latexTa.addEventListener('input', function() {
      if (!_latexEditor) scheduleRender();
    });
  }

  function scheduleRender() {
    var cb = document.getElementById('latex-autorender');
    if (cb && !cb.checked) return;
    clearTimeout(_renderTimer);
    _renderTimer = setTimeout(renderLatex, 350);
  }

  // ── Toolbar insertion ────────────────────────────────────────────────
  function insertLatex(text) {
    if (_latexEditor) {
      var cur = _latexEditor.getCursor();
      _latexEditor.replaceRange(text, cur);
      _latexEditor.focus();
      _latexEditor.setCursor({ line: cur.line, ch: cur.ch + text.length });
    } else if (_latexTa) {
      var start = _latexTa.selectionStart, end = _latexTa.selectionEnd;
      _latexTa.value = _latexTa.value.substring(0, start) + text + _latexTa.value.substring(end);
      _latexTa.selectionStart = _latexTa.selectionEnd = start + text.length;
      _latexTa.focus();
    }
  }

  ws.querySelector('#latex-toolbar').addEventListener('change', function(e) {
    var sel = e.target.closest('.ltx-select');
    if (!sel) return;
    var value = sel.value;
    if (!value) return;
    insertLatex(value);
    sel.selectedIndex = 0;
    scheduleRender();
  });

  ws.querySelectorAll('.ltx-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var latex = this.getAttribute('data-latex');
      if (!latex) return;
      insertLatex(latex);
      scheduleRender();
    });
  });

  // ── Copy LaTeX code ──────────────────────────────────────────────────
  document.getElementById('latex-copy-code').addEventListener('click', function() {
    var text = getLatexCode();
    navigator.clipboard.writeText(text).then(function() {
      showToast('LaTeX code copied!', 'success');
    }).catch(function() {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      showToast('Copied!', 'success');
    });
  });

  // ── Helper: render LaTeX to a styled div ────────────────────────────
  function renderLatexToDiv(code) {
    var div = document.createElement('div');
    div.style.cssText = 'padding:20px;background:white;display:inline-block;font-size:18px';
    try {
      katex.render(code, div, { displayMode: true, throwOnError: false, output: 'html' });
    } catch(e) {
      div.textContent = code;
      div.style.fontFamily = 'monospace';
      div.style.fontSize = '14px';
      div.style.whiteSpace = 'pre-wrap';
    }
    return div;
  }

  // ── Helper: capture div to canvas blob ──────────────────────────────
  function captureDivToBlob(div, scale, format, quality) {
    return new Promise(function(resolve, reject) {
      if (typeof html2canvas !== 'undefined') {
        html2canvas(div, {
          scale: scale || 3,
          useCORS: true,
          backgroundColor: '#ffffff',
          width: div.scrollWidth,
          height: div.scrollHeight
        }).then(function(canvas) {
          canvas.toBlob(function(blob) {
            if (blob) resolve(blob);
            else reject(new Error('Blob creation failed'));
          }, format || 'image/png', quality || 1);
        }).catch(reject);
      } else {
        reject(new Error('html2canvas not loaded'));
      }
    });
  }

  // ── Copy as Image ────────────────────────────────────────────────────
  document.getElementById('latex-copy-image').addEventListener('click', function() {
    var btn = this; btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    var code = getLatexCode().trim();
    if (!code) { alert('No content'); btn.disabled = false; btn.innerHTML = '<i class="fas fa-image"></i> Copy Image'; return; }

    var renderDiv = renderLatexToDiv(code);
    document.body.appendChild(renderDiv);

    if (typeof html2canvas === 'undefined') {
      document.body.removeChild(renderDiv);
      loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js').then(function() {
        document.getElementById('latex-copy-image').click();
      }).catch(function() {
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-image"></i> Copy Image';
        alert('Failed to load image library');
      });
      return;
    }

    captureDivToBlob(renderDiv, 3, 'image/png', 1).then(function(blob) {
      document.body.removeChild(renderDiv);
      if (navigator.clipboard && navigator.clipboard.write) {
        navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function() {
          showToast('Image copied to clipboard!', 'success');
        }).catch(function() {
          var url = URL.createObjectURL(blob);
          downloadData('latex-image.png', url);
          URL.revokeObjectURL(url);
          showToast('Image downloaded (clipboard not available)', 'info');
        });
      } else {
        var url = URL.createObjectURL(blob);
        downloadData('latex-image.png', url);
        URL.revokeObjectURL(url);
        showToast('Image downloaded', 'success');
      }
    }).catch(function() {
      document.body.removeChild(renderDiv);
      showToast('Image capture failed', 'error');
    }).finally(function() {
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-image"></i> Copy Image';
    });
  });

  // ── Download PDF ─────────────────────────────────────────────────────
  document.getElementById('latex-pdf-btn').addEventListener('click', function() {
    var btn = this; btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    var code = getLatexCode().trim();
    if (!code) { alert('No content'); btn.disabled = false; btn.innerHTML = '<i class="fas fa-file-pdf"></i> Download PDF'; return; }

    var renderDiv = renderLatexToDiv(code);
    document.body.appendChild(renderDiv);

    var _jspdfAvail = typeof window.jspdf !== 'undefined' && typeof window.jspdf.jsPDF !== 'undefined';
    if (typeof html2canvas === 'undefined' || !_jspdfAvail) {
      document.body.removeChild(renderDiv);
      Promise.all([
        typeof html2canvas === 'undefined'
          ? loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js')
          : Promise.resolve(),
        !_jspdfAvail
          ? loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
          : Promise.resolve()
      ]).then(function() {
        document.getElementById('latex-pdf-btn').click();
      }).catch(function() {
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-file-pdf"></i> Download PDF';
        alert('Failed to load PDF libraries');
      });
      return;
    }

    captureDivToBlob(renderDiv, 2, 'image/png', 1).then(function(blob) {
      document.body.removeChild(renderDiv);
      var reader = new FileReader();
      reader.onload = function() {
        var imgData = reader.result;
        var PDFClass = window.jspdf.jsPDF;
        var pdf = new PDFClass({
          orientation: renderDiv.scrollWidth > renderDiv.scrollHeight ? 'landscape' : 'portrait',
          unit: 'in',
          format: 'letter'
        });
        var pageW = 8.5, pageH = 11;
        var margin = 0.75;
        var maxW = pageW - 2 * margin;
        var maxH = pageH - 2 * margin;
        var imgW = renderDiv.scrollWidth / 96;
        var imgH = renderDiv.scrollHeight / 96;
        var scale = Math.min(maxW / imgW, maxH / imgH, 1);
        var finalW = imgW * scale;
        var finalH = imgH * scale;
        var xOff = (pageW - finalW) / 2;
        var yOff = (pageH - finalH) / 2;
        pdf.addImage(imgData, 'PNG', xOff, yOff, finalW, finalH);
        pdf.save('latex-equation.pdf');
        showToast('PDF downloaded!', 'success');
      };
      reader.readAsDataURL(blob);
    }).catch(function() {
      document.body.removeChild(renderDiv);
      showToast('PDF generation failed', 'error');
    }).finally(function() {
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-file-pdf"></i> Download PDF';
    });
  });
};

window.tool_math_calculator = function() {
  var ws = document.getElementById('tool-workspace');
  ws.innerHTML = '<div class="flex items-center gap-2 mb-2">' +
    '<span class="text-[10px] font-semibold text-gray-500 dark:text-gray-400"><i class="fas fa-calculator mr-1"></i> Ahmed Calculator</span>' +
    '<span class="flex-1"></span>' +
    '<button onclick="toggleToolFullscreen()" class="px-2 py-1 text-[10px] bg-gray-200 dark:bg-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-500 transition" title="Fullscreen"><i class="fas fa-expand"></i></button>' +
  '</div>' +
  '<div id="ahmed-calc-mount"></div>';

  // Load CSS
  if (!document.querySelector('link[href*="ahmed-calc/style.css"]')) {
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = '/static/css/ahmed-calc/style.css';
    document.head.appendChild(link);
  }

  // Load math.js CDN (needed by evaluation pipeline)
  if (typeof math === 'undefined') {
    var mScript = document.createElement('script');
    mScript.src = 'https://cdn.jsdelivr.net/npm/mathjs@12.4.1/lib/browser/math.js';
    document.body.appendChild(mScript);
  }

  // Load Ahmed Calculator modules (MathIO architecture)
  var scripts = [
    '/static/js/ahmed-calc/core/state.js',
    '/static/js/ahmed-calc/core/latex-parser.js',
    '/static/js/ahmed-calc/core/history.js',
    '/static/js/ahmed-calc/input/keypad.js',
    '/static/js/ahmed-calc/input/keyboard.js',
    '/static/js/ahmed-calc/modes/mode-manager.js',
    '/static/js/ahmed-calc/modes/graph-mode.js',
    '/static/js/ahmed-calc/modes/table-mode.js',
    '/static/js/ahmed-calc/modes/algebra-mode.js',
    '/static/js/ahmed-calc/ui/indicators.js',
    '/static/js/ahmed-calc/main.js',
  ];

  var _calcInstance = null;

  function loadNext(idx) {
    if (idx >= scripts.length) {
      _calcInstance = new AhmedCalculator('ahmed-calc-mount');
      _calcInstance.init();
      return;
    }
    var s = document.createElement('script');
    s.src = scripts[idx];
    s.onload = function() { loadNext(idx + 1); };
    s.onerror = function() { console.error("Failed to load", scripts[idx]); showToast("Calculator: failed to load " + scripts[idx].split('/').pop(), "error"); loadNext(idx + 1); };
    document.body.appendChild(s);
  }
  loadNext(0);

  window._cleanupCalc = function() {
    if (_calcInstance) {
      _calcInstance.dispose();
      _calcInstance = null;
    }
    delete window._cleanupCalc;
  };
};

// ═══════════════════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════════════════

renderToolGrid();
</script>
